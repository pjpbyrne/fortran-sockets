name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran
            os: ubuntu-latest
            compiler: gcc
            version: 13
            fypp: true
          - name: Linux / Intel ifx
            # setup-fortran v1.10.0's Intel installer uses apt-key, which was
            # removed in Ubuntu 26.04 (now ubuntu-latest). Fixed on its main
            # branch (#301) but not yet released; return to ubuntu-latest then.
            os: ubuntu-24.04
            compiler: intel
            version: '2024.1'
            fypp: true
          - name: macOS / gfortran
            os: macos-latest
            compiler: gcc
            version: 13
            fypp: true
          - name: Linux / gfortran / no fypp (uses preprocessed/)
            os: ubuntu-latest
            compiler: gcc
            version: 13
            fypp: false
          # Memory errors, undefined behaviour and Fortran bounds/argument checks
          - name: Linux / gfortran / sanitizers + -fcheck=all
            os: ubuntu-latest
            compiler: gcc
            version: 13
            fypp: true
            cmake_args: >-
              -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -g'
              -DCMAKE_Fortran_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer -fcheck=all -g'
              -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          # Exercise the send/recv chunking loop, otherwise only reached above 1 GiB
          - name: Linux / gfortran / 1000-byte send/recv chunks
            os: ubuntu-latest
            compiler: gcc
            version: 13
            fypp: true
            cmake_args: -DCMAKE_C_FLAGS=-DF90SOCKETS_MAX_CHUNK=1000
          # Generic resolution of the int32/int64 counts with 8-byte default integers
          - name: Linux / gfortran / 8-byte default integers
            os: ubuntu-latest
            compiler: gcc
            version: 13
            fypp: true
            cmake_args: -DCMAKE_Fortran_FLAGS=-fdefault-integer-8
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1   # make UBSan failures fail the test
    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fypp
        if: matrix.fypp
        run: python -m pip install fypp

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  make:
    name: Linux / Makefile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fypp
        run: python -m pip install fypp

      - name: Build and test
        run: make test

  freebsd:
    name: FreeBSD / gfortran (uses preprocessed/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake gcc python3
          run: |
            set -e
            FC=$(ls /usr/local/bin/gfortran[0-9]* | head -n 1)
            echo "Using $FC"
            cmake -S . -B build -DCMAKE_Fortran_COMPILER="$FC"
            cmake --build build
            ctest --test-dir build --output-on-failure
