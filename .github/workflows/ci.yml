name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  cmake:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / gfortran
            os: ubuntu-latest
            compiler: gcc
            version: 13
            fypp: true
          - name: Linux / Intel ifx
            # setup-fortran's Intel installer uses apt-key, which Ubuntu 24.04
            # (ubuntu-latest) no longer ships
            os: ubuntu-22.04
            compiler: intel
            version: '2024.1'
            fypp: true
          - name: macOS / gfortran
            os: macos-latest
            compiler: gcc
            version: 13
            fypp: true
          - name: Linux / gfortran / no fypp (uses preprocessed/)
            os: ubuntu-latest
            compiler: gcc
            version: 13
            fypp: false
    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fypp
        if: matrix.fypp
        run: python -m pip install fypp

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  make:
    name: Linux / Makefile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fypp
        run: python -m pip install fypp

      - name: Build and test
        run: make test

  freebsd:
    name: FreeBSD / gfortran (uses preprocessed/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y cmake gcc python3
          run: |
            set -e
            FC=$(ls /usr/local/bin/gfortran[0-9]* | head -n 1)
            echo "Using $FC"
            cmake -S . -B build -DCMAKE_Fortran_COMPILER="$FC"
            cmake --build build
            ctest --test-dir build --output-on-failure
